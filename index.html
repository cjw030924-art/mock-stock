<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JH증권</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233182f6'/%3E%3Cstop offset='1' stop-color='%236a3df0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Cpath d='M8 27 L16 19 L21 23 L31 12' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25 12 H31 V18' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3182f6"/>
            <stop offset="1" stop-color="#6a3df0"/>
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#logo-g)"/>
        <rect x="8" y="24" width="4" height="8" rx="1.5" fill="#fff" opacity=".45"/>
        <rect x="15" y="20" width="4" height="12" rx="1.5" fill="#fff" opacity=".45"/>
        <rect x="22" y="22" width="4" height="10" rx="1.5" fill="#fff" opacity=".45"/>
        <path d="M8 21 L16 14 L21 18 L31 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25.5 9 H31 V14.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>JH<em>증권</em></span>
    </h1>
    <nav class="nav">
      <button data-page="browse">주식 둘러보기</button>
      <button data-page="recent">최근 본</button>
      <button data-page="mine">내 주식</button>
    </nav>
    <div class="summary">
      <div><span>총 자산</span><b id="total">-</b></div>
      <div><span>현금</span><b id="cash">-</b></div>
    </div>
  </header>

  <main>
    <div class="side">
      <!-- 주식 둘러보기 -->
      <section class="panel page" id="page-browse">
        <h2>주식 둘러보기</h2>
        <div class="tabs">
          <button data-tab="ALL">전체</button>
          <button data-tab="KR">국내</button>
          <button data-tab="US">해외</button>
        </div>
        <div class="sorts">
          <button data-sort="amount">거래대금</button>
          <button data-sort="shares">거래량</button>
          <button data-sort="up">급상승</button>
          <button data-sort="down">급하락</button>
        </div>
        <ul class="list" id="browse-list"></ul>
      </section>

      <!-- 최근 본 -->
      <section class="panel page" id="page-recent">
        <h2>최근 본 주식</h2>
        <ul class="list" id="recent-list"></ul>
        <p id="recent-empty" class="muted">아직 본 종목이 없습니다. 주식 둘러보기에서 종목을 눌러 보세요.</p>
      </section>

      <!-- 내 주식 -->
      <section class="page" id="page-mine">
        <div class="panel">
          <h2>내 자산</h2>
          <div class="cards">
            <div><span>총 자산</span><b id="m-total">-</b></div>
            <div><span>주식 평가금액</span><b id="m-value">-</b></div>
            <div><span>현금</span><b id="m-cash">-</b></div>
            <div><span>평가 손익</span><b id="m-pnl">-</b></div>
          </div>
        </div>
        <div class="panel">
          <h2>보유 종목</h2>
          <ul class="list" id="hold-list"></ul>
          <p id="hold-empty" class="muted">아직 보유한 종목이 없습니다.</p>
        </div>
        <div class="panel">
          <h2>거래 내역</h2>
          <ul id="hist"></ul>
          <button id="reset" class="ghost">자산 초기화</button>
        </div>
      </section>
    </div>

    <section class="panel detail">
      <div class="detail-head">
        <div class="d-title">
          <span id="d-logo"></span>
          <div>
            <h2 id="d-name">-</h2>
            <span id="d-code" class="muted"></span>
          </div>
        </div>
        <div class="right">
          <b id="d-price" class="big">-</b>
          <span id="d-change"></span>
        </div>
      </div>
      <canvas id="chart"></canvas>

      <div class="order">
        <span id="cost" class="muted"></span>
        <div class="btns">
          <button id="buy" class="buy">매수</button>
          <button id="sell" class="sell">매도</button>
        </div>
      </div>
      <p id="msg" class="msg"></p>

      <div class="book-wrap">
        <h3>호가 <small class="muted">매도는 파랑, 매수는 빨강 · 누르면 주문</small></h3>
        <div id="book" class="book"></div>
        <div class="book-sum muted"><span id="ask-total"></span><span id="bid-total"></span></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mo-title">
      <h3 id="mo-title"></h3>
      <p id="mo-price" class="muted"></p>
      <label class="mo-label" for="mo-qty">수량</label>
      <div class="mo-row">
        <input id="mo-qty" type="number" min="1" inputmode="numeric">
        <span>주</span>
      </div>
      <div class="quick">
        <button data-q="1">+1</button>
        <button data-q="10">+10</button>
        <button data-q="100">+100</button>
        <button id="mo-max" class="max"></button>
      </div>
      <p id="mo-avail" class="muted"></p>
      <div class="mo-sum">
        <span>주문 금액</span><b id="mo-total"></b>
      </div>
      <p id="mo-after" class="muted"></p>
      <p id="mo-err" class="msg up"></p>
      <div class="mo-btns">
        <button id="mo-cancel" class="cancel">취소</button>
        <button id="mo-ok" class="ok"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
